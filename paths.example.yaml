# Copy to paths.yaml (git-ignored) and edit. Package code never contains absolute paths.
data_root: /path/to/data                      # asset latents + renders referenced by the manifests
manifests: /path/to/manifests                 # training manifests (jsonl), used as ${manifests} in configs/data
runs: /path/to/runs                           # training outputs; relative checkpoint paths resolve here
hf_cache: /path/to/hf_cache                   # HF_HOME holding the pinned encoder snapshots
encoders:
  qwen: Qwen/Qwen3-VL-2B-Instruct@89644892e4d85e24eaac8bacfd4f463576704203
  dino: camenduru/dinov3-vitl16-pretrain-lvd1689m@3c276edd     # DINOv3 mirror used by TRELLIS.2
trellis2_ckpt: /path/to/TRELLIS.2-4B          # released TRELLIS.2-4B (ckpts/*.json + .safetensors)
ss_decoder: /path/to/TRELLIS-image-large/ckpts/ss_dec_conv3d_16l8_fp16   # TRELLIS (v1) sparse-structure decoder
uni3d_ckpt: null                              # ROAD teacher (Uni3D-g model.pt); null = look it up in hf_cache
voxel_table: null                             # optional per-asset voxel counts (npz: sha, vox) for voxel-balanced batching
