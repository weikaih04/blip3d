# S3: the unified three-tower model (union attention, SS lane, fused kernels) initialised from the three S2 finals.
# 32k steps, the last 3k a cosine decay.
name: blip3d-v12-s3-unify
stage: s3
data: v12_unify
init:
  shape: blip3d-v12-s2-shape/checkpoint-106000
  tex: blip3d-v12-s2-tex/checkpoint-106000
  ss: blip3d-v12-s2-ss/checkpoint-106000
  use_ema: true
trainable: all
lr: 2.0e-5
max_steps: 32000
decay_steps: 3000
compute: {nodes: 4, per_gpu_bs: 4, save_steps: 1000, keep: 6, workers: 8}
unified: {p_solo: 0.0, p_lag: 0.3, p_corner: 0.1, p_corner2: 0.2, k0_lo: 3, k0_hi: 11, ss_dual: true,
          geo_loss_w: 1.0, ss_loss_w: 1.0, p_cfg: 0.1, p_dino: 0.3, p_qwen: 0.1, probe_every: 200}
