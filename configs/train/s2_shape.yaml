# S2: full fine-tune of the shape tower (elastic activation checkpointing on).
name: blip3d-v12-s2-shape
stage: s2
tower: shape
data: v12_shape
init: {from: blip3d-v12-s1-shape/checkpoint-20000, use_ema: true}   # end of the S1 stable phase
trainable: all
lr: 2.0e-5
max_steps: 106000
decay_steps: 6000
compute: {nodes: 2, per_gpu_bs: 8, save_steps: 5000, keep: 6, workers: 10}
