# S3: the unified three-tower model (union attention, SS lane, fused kernels) initialised from the three S2 finals.
# v12 ran 15k steps on 5 nodes then restarted weights-only on 4 nodes for 17k (3k cosine decay); this is the clean
# single-run equivalent (32k, decay 3k).
name: blip3d-v12-s3-unify
stage: s3
data: v12_unify
init:
  shape: keep/v12/s2_shape/checkpoint-106000_ema
  tex: keep/v12/s2_tex/checkpoint-106000_ema
  ss: keep/v12/s2_ss/checkpoint-106000_ema
  use_ema: false
trainable: all
lr: 2.0e-5
max_steps: 32000
decay_steps: 3000
compute: {nodes: 4, per_gpu_bs: 4, save_steps: 1000, keep: 6, workers: 8}
unified: {p_solo: 0.0, p_lag: 0.3, p_corner: 0.1, p_corner2: 0.2, k0_lo: 3, k0_hi: 11, ss_dual: true,
          geo_loss_w: 1.0, ss_loss_w: 1.0, p_cfg: 0.1, p_dino: 0.3, p_qwen: 0.1, probe_every: 200}
