# SS continuation (the 2026-09-24 run): a true resume of S2 SS from its last stable-phase checkpoint (global 100k) with the
# stable phase extended to 300k and a 6k cosine decay. Weights, AdamW, step and EMA (n) carry over.
# The v12 checkpoint counts steps locally (100k = 4-node run step 25000): convert it once with
#   python tools/import_v12.py --src keep/v12/s2_ss/checkpoint-100000 --kind ss --global-step 100000 --ema-n 25000 \
#          --dst blip3d-v12-cont-ss/checkpoint-100000
name: blip3d-v12-cont-ss
stage: cont
tower: ss
data: v12_ss
resume: blip3d-v12-cont-ss/checkpoint-100000
trainable: all
lr: 2.0e-5
max_steps: 306000
decay_steps: 6000
compute: {nodes: 4, per_gpu_bs: 4, save_steps: 5000, keep: 10, workers: 10}
